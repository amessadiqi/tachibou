[alembic]
script_location = src/tachibou/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///unused

; The application resolves the real SQLite URL from TACHIBOU_DATA_DIR.
; sqlalchemy.url above is unused.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
