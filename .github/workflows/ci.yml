name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed CLI and bundled frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/tachibou-venv"
          venv="${RUNNER_TEMP}/tachibou-venv"
          "${venv}/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          test "$("${venv}/bin/tachibou" version)" = "0.1.0"
          "${venv}/bin/python" -c "from functools import reduce; from importlib.resources import files; root = files('tachibou'); required = ['static/index.html', 'migrations/env.py', 'migrations/versions/0001_initial.py', 'migrations/script.py.mako']; missing = [item for item in required if not reduce(lambda node, part: node.joinpath(part), item.split('/'), root).is_file()]; assert not missing, 'Missing packaged files: ' + ', '.join(missing); print('Packaged files ok')"
          export TACHIBOU_DATA_DIR="${RUNNER_TEMP}/tachibou-data"
          "${venv}/bin/tachibou" start --port 8741 >"${RUNNER_TEMP}/tachibou-server.log" 2>&1 &
          pid=$!
          cleanup() {
            kill "${pid}" >/dev/null 2>&1 || true
            wait "${pid}" || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8741/api/health" >"${RUNNER_TEMP}/health.json"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "Server failed to start"
            cat "${RUNNER_TEMP}/tachibou-server.log"
            exit 1
          fi
          "${venv}/bin/python" -c "import json, os; from pathlib import Path; data = json.loads(Path(os.environ['RUNNER_TEMP'], 'health.json').read_text(encoding='utf-8')); assert data['status'] == 'ok' and data['database'] == 'ok' and data['version'] == '0.1.0', data; print(data)"
          curl -fsS "http://127.0.0.1:8741/" | grep -q "Tâchibou"
